<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="ext-resource-dependency" content="assets/amapola-logo.png" data-resource-id="logo" />
<title>Amapola · Tejidos Artesanales</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #FBF6F1;
    color: var(--ink, #3B302A);
    font-family: 'Nunito Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { max-width: 1240px; margin: 0 auto; width: 100%; }
  button { font-family: inherit; }
  input, select { font-family: inherit; outline: none; }
  input::placeholder { color: var(--muted); }
  ::selection { background: var(--accent, #CE8C66); color: #fff; }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  img { -webkit-user-drag: none; user-select: none; }
  /* scrollbar suave */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong, #d8c8ba); border-radius: 99px; border: 3px solid var(--bg, #FBF6F1); }

  @media (max-width: 900px) {
    .wrap > div[style*="grid-template-columns: 1.05fr"],
    .wrap > div[style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail" data-bg-color="#F3E7DD">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#F3E7DD"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#CE8C66" stroke-width="2"/>
      <text x="50" y="46" font-family="Georgia, serif" font-size="13" fill="#3B302A" text-anchor="middle" letter-spacing="1.5">AMAPOLA</text>
      <circle cx="50" cy="62" r="4" fill="#CE8C66"/>
      <path d="M50 66 L50 74" stroke="#7E9266" stroke-width="1.5"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="pages.jsx"></script>
  <script type="text/babel" src="pages2.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
